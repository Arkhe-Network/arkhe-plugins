[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "OpenSSL",
    "Zlib","Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Apache-2.0 OR MIT", "MIT OR Apache-2.0", "MIT OR Apache-2.0 OR Zlib"]

[bans]
multiple-versions = "deny"
